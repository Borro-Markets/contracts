[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
remappings = [
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "@uniswap/v4-core/=lib/v4-periphery/lib/v4-core/",
  "solmate/=lib/v4-periphery/lib/v4-core/lib/solmate/",
  "@uniswap/v4-periphery/=lib/v4-periphery/",
  "morpho-blue/=lib/morpho-blue/src/",
  "vault-v2/=lib/vault-v2/src/",
  "morpho-oracles/=lib/morpho-blue-oracles/src/",
]
fs_permissions = [{ access = "read", path = "./script" }, { access = "read-write", path = "./script/out" }, { access = "read", path = "./test/fixtures" }]

# A named RPC whose URL comes from the environment, so it never appears on a command line.
[rpc_endpoints]
robinhood = "${BORRO_RPC_URL}"
